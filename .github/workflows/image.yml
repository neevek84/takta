# Publie l'image de takta sur Docker Hub, d'où Container Manager la surveille.
#
# **Déclenché par une étiquette de version, jamais par une fusion.** Sur un
# produit public, `latest` désigne ce que les gens installent : le laisser
# suivre chaque fusion dans `main` ferait d'un correctif en cours une version
# livrée, sans que personne l'ait décidé. Poser `v1.4.0` est cette décision.
#
# **Deux étiquettes, et une seule est surveillée.** Container Manager ne
# notifie une mise à jour que pour `latest` — les étiquettes de version, elles,
# ne servent qu'au retour arrière, mais sans elles il n'y en a aucun.
name: image

on:
  push:
    tags:
      - 'v*'

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `arm64` n'est pas du zèle : les Synology x86 sont en `amd64`, les
      # modèles à processeur ARM en `arm64`. Publier les deux évite d'avoir à
      # savoir sur quel modèle l'image atterrira.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Étiquettes
        id: etiquettes
        run: |
          # L'étiquette git porte le « v » ; l'étiquette d'image, non.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/takta:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/takta:${{ steps.etiquettes.outputs.version }}
          # Le cache évite de reconstruire `npm ci` à chaque version.
          cache-from: type=gha
          cache-to: type=gha,mode=max
