services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: cra
      POSTGRES_DB: cra
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cra"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # `.dockerignore` exclut `.env` : rien n'entre dans le conteneur qui ne
    # soit listé ici. Toute variable de `.env.example` doit donc y figurer —
    # `src/deploy/deployment-config.test.ts` le vérifie à chaque exécution de
    # la suite.
    environment:
      DATABASE_URL: postgresql://cra:cra@db:5432/cra
      AUTH_SECRET: ${AUTH_SECRET:?definir AUTH_SECRET (openssl rand -base64 32)}
      AUTH_TRUST_HOST: "true"
      # Chiffre les jetons Google au repos. Exigée au démarrage, et non à la
      # première connexion Google : absente, elle ne se manifesterait qu'au
      # retour du consentement, très loin d'ici, sur un écran qui ne peut que
      # proposer de recommencer. La perdre impose de reconnecter Google —
      # aucun jeton n'est récupérable sans elle.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?definir CREDENTIALS_KEY (openssl rand -base64 32)}
      # Connecteur Google : entièrement optionnel. Vides, la connexion est
      # simplement indisponible et l'application fonctionne sans agenda.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      CRA_TIMEZONE: ${CRA_TIMEZONE:-Europe/Paris}
      # Vide = POST /api/sync/flush fermé. Le bouton « Synchroniser
      # maintenant » suffit sans lui.
      SYNC_FLUSH_TOKEN: ${SYNC_FLUSH_TOKEN:-}
      # Jeton d'instance de l'API d'événements et du réveil de l'ordonnanceur.
      # Vide = ces endpoints restent fermés : une installation qui n'expose
      # rien à l'extérieur doit pouvoir démarrer.
      CRA_API_TOKEN: ${CRA_API_TOKEN:-}
      # Seul secret SMTP ; le reste de la configuration se saisit en base.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Signature électronique : entièrement optionnelle. Vides, le connecteur
      # n'existe pas — le PDF se génère et se télécharge, et les transitions du
      # CRA restent manuelles.
      DOCUMENSO_URL: ${DOCUMENSO_URL:-}
      DOCUMENSO_API_KEY: ${DOCUMENSO_API_KEY:-}
      # Vide = POST /api/webhooks/signature refuse tout. Un point d'entrée qui
      # verrouille un mois ne s'ouvre pas « par défaut » ; le bouton de
      # rafraîchissement et les transitions manuelles suffisent sans lui.
      SIGNATURE_WEBHOOK_SECRET: ${SIGNATURE_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
